apiVersion: v1
kind: Service
metadata:
  name: {{ include "eternal.fullname" . }}
  labels:
    {{- include "eternal.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "eternal.selectorLabels" . | nindent 4 }}
  ports:
    - name: panel
      port: {{ .Values.panel.port }}
      targetPort: panel
      protocol: TCP
    {{- range .Values.service.extraPorts }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default .port }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
