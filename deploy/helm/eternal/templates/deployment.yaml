{{- if and (ne .Values.database.type "sqlite") (not (or .Values.database.dsn .Values.database.existingSecret)) }}
{{- fail "database.dsn or database.existingSecret is required when database.type is not sqlite" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eternal.fullname" . }}
  labels:
    {{- include "eternal.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "eternal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eternal.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: eternal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: panel
              containerPort: {{ .Values.panel.port }}
              protocol: TCP
          env:
            {{- if .Values.panel.port }}
            - name: XUI_PORT
              value: {{ .Values.panel.port | quote }}
            {{- end }}
            {{- if include "eternal.externalDB" . }}
            - name: XUI_DB_TYPE
              value: {{ .Values.database.type | quote }}
            - name: XUI_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "eternal.dbSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            tcpSocket:
              port: panel
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: panel
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: panel
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /etc/eternal
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "eternal.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
