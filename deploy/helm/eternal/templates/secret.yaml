{{- if and (include "eternal.externalDB" .) (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eternal.dbSecretName" . }}
  labels:
    {{- include "eternal.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.dsn | quote }}
{{- end }}
